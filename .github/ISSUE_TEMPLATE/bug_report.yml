name: Bug report
description: Report a confirmed or suspected defect
title: "[bug] "
labels: ["bug", "needs-reproduction"]
body:
  - type: input
    id: component
    attributes:
      label: Component / crate
      placeholder: e.g. runner, trading_engine, research_cli
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision (git SHA or tag)
      placeholder: e.g. v0.1.1 or abcdef0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust toolchain, Paper vs other venue (no credentials)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Redact secrets, tokens, and personal paths
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration (no credentials)
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities: use https://github.com/Kolzodev712/trading_system/security/advisories/new (see SECURITY.md), not this form.
