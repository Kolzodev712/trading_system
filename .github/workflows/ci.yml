name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check code formatting
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Lint with clippy
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build all packages
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - runner
          - trading-cli
        mode:
          - levels
          - strategies
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build package
        run: |
          if [ "${{ matrix.package }}" = "runner" ]; then
            cargo build --release --package runner
          elif [ "${{ matrix.package }}" = "trading-cli" ]; then
            cargo build --release --package cli --bin trading-cli
          fi

  # Run unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run unit tests
        run: cargo test --lib --all-features

  # Run integration tests (excluding ignored tests)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run integration tests (excluding ignored)
        run: cargo test --test integration -- --test-threads=1

  # Check that all packages compile
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Cargo check
        run: cargo check --all-targets --all-features
      
      # Note: Python config generation will be added when implemented
      # This would generate indicators.json before Rust build
      # - name: Generate indicator configs (if Python code exists)
      #   working-directory: python
      #   run: |
      #     if [ -f "indicator_config_generator/src/cli.py" ]; then
      #       uv run indicator-generate --pairs BTCUSDT --output ../config/indicators.json || true
      #     fi

  # Build Docker images (optional, for validation)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build runner image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: trading-system:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cli
          push: false
          tags: trading-system-cli:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Python workspace validation
  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            python/.venv
            ~/.cache/uv
          key: ${{ runner.os }}-python-${{ hashFiles('python/**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-
      
      - name: Install Python dependencies
        working-directory: python
        run: uv sync --dev
      
      - name: Check Python workspace structure
        working-directory: python
        run: |
          # Verify workspace packages exist
          test -d indicator_config_generator || exit 1
          test -d strategy_dsl || exit 1
          test -f pyproject.toml || exit 1
      
      - name: Verify uv.lock is up to date (if exists)
        working-directory: python
        run: |
          if [ -f "uv.lock" ]; then
            uv lock --check || (echo "Error: uv.lock is out of date. Run 'uv lock' to update." && exit 1)
          else
            echo "Note: uv.lock not found. This is expected if dependencies haven't been added yet."
          fi
      
      # Note: Linting/tests will be added when Python code is implemented
      # - name: Lint Python code
      #   working-directory: python
      #   run: uv run ruff check .
      #
      # - name: Type check Python code
      #   working-directory: python
      #   run: uv run mypy .
      #
      # - name: Run Python tests
      #   working-directory: python
      #   run: uv run pytest

