[package]
name = "kolzo_trading_system"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "src/core_logic", 
    "src/market_data", 
    "src/trading",
    ]

[workspace.dependencies]
# Logging
tracing = { version = "0.1.40" }

# SerDe
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.32.0", features = ["full"] }
async-trait = "0.1.73"
tokio-tungstenite = { version = "0.14", features = ["rustls-tls"] }

# HTTP
reqwest = "0.11"
url = "2.2"

# Errors
anyhow = { version = "1.0", default-features = false }
thiserror = "1.0"

# Utrils
futures-util = "0.3"
chrono = "0.4.31"
smol_str = "0.2"

# Testing
tokio-test = "0.4"

[dependencies]

[dev-dependencies]
