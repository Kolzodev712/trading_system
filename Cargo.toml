[package]
name = "trading_system"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "src/core_logic", 
    "src/exchange_engine",
    "src/trading_engine",
    "src/market_data_engine", 
    "src/runner", 
    ]

[workspace.dependencies]
# Logging
tracing = "0.1.40" 
tracing-subscriber = "0.3.19"

# SerDe
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9.0"
serde_urlencoded = { version = "0.7.1" }
serde_qs = "0.12.0"

# Async
tokio = { version = "1.32.0", features = ["full"] }
tokio-stream = "0.1.17"
async-trait = "0.1.73"
tokio-tungstenite = { version = "0.14", features = ["rustls-tls"] }

# HTTP
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.2"
urlencoding = "2.1.3"

# Errors
anyhow = { version = "1.0", default-features = false }
thiserror = "1.0"

# Authentication
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
ring = "0.17.8"
pem = "3.0.4"
uuid = { version = "1.10.0", features = [ "v4", "fast-rng", "macro-diagnostics" ]}
ed25519-dalek = "2.1.1"

# Storage
redis = { version = "0.27.6", features = ["tokio-comp"] }

# Utrils
futures-util = "0.3"
chrono = { version = "0.4.31", features = ["serde"] }
smol_str = "0.2"
rust_decimal = {version = "1.35.0", features = ["serde"]}
base64 = "0.22.1"

# Testing
tokio-test = "0.4"

[dependencies]

[dev-dependencies]
