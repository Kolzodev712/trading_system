[package]
name = "kolzo_trading_system"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "src/core_logic", 
    "src/market_data", 
    "src/trading",
    ]

[workspace.dependencies]
# Logging
tracing = { version = "0.1.40" }

# SerDe
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9.0"

# Async
tokio = { version = "1.32.0", features = ["full"] }
async-trait = "0.1.73"
tokio-tungstenite = { version = "0.14", features = ["rustls-tls"] }

# HTTP
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.2"
urlencoding = "2.1.3"

# Errors
anyhow = { version = "1.0", default-features = false }
thiserror = "1.0"

# Authentication
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
ring = "0.17.8"
pem = "3.0.4"
uuid = { version = "1.10.0", features = [ "v4", "fast-rng", "macro-diagnostics" ]}

# Utrils
futures-util = "0.3"
chrono = "0.4.31"
smol_str = "0.2"
rust_decimal = {version = "1.35.0", features = ["serde"]}
base64 = "0.22.1"

# Testing
tokio-test = "0.4"

[dependencies]

[dev-dependencies]
