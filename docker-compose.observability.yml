# Observability stack: Jaeger (traces) + Prometheus (metrics) + Grafana (dashboards)
# Use with main compose: docker-compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Or run standalone (then point Prometheus at your app's metrics URL).

version: '3.8'

services:
  # Override trading-system so it sends traces to Jaeger when observability stack is used
  trading-system:
    environment:
      - TRACE_JAEGER_AGENT_ENDPOINT=jaeger:6831
      # Standard OpenTelemetry env vars (opentelemetry-jaeger reads these when resolving agent endpoint)
      - OTEL_EXPORTER_JAEGER_AGENT_HOST=jaeger
      - OTEL_EXPORTER_JAEGER_AGENT_PORT=6831

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: trading-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "6831:6831/udp" # Agent (thrift compact)
      - "14268:14268"   # Collector (e.g. HTTP)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - trading-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: trading-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - trading-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: trading-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - trading-network

volumes:
  grafana_data:
    driver: local

networks:
  trading-network:
    driver: bridge
