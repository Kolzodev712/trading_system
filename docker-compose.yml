version: '3.8'

services:
  # MongoDB for configuration persistence
  mongodb:
    image: mongo:7.0
    container_name: trading-system-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"  # Use different host port to avoid conflict with host MongoDB
    environment:
      MONGO_INITDB_DATABASE: trading_system
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  # Trading System Runner (main service)
  trading-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-system
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "50051:50051"  # gRPC
      - "8080:8080"    # Health endpoint
    environment:
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro  # Mount config as read-only
      - trading-logs:/app/logs
    networks:
      - trading-network
    # Override command if needed
    # For strategies mode, uncomment the line below:
    command: ["/app/trading-system", "--mode", "strategies", "--strategies-config", "/app/config/strategies.json"]
    # For levels mode (default), comment out the line above or remove it
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # TUI CLI (interactive - run manually when needed)
  # Note: This service is defined but typically run manually with docker run
  # Use: docker-compose run --rm trading-cli
  # Or: ./scripts/run-tui-docker.sh
  trading-cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: trading-cli
    depends_on:
      trading-system:
        condition: service_healthy
    environment:
      - RUST_LOG=info
    networks:
      - trading-network
    stdin_open: true
    tty: true
    command: ["http://trading-system:50051"]
    profiles:
      - cli  # Only start with --profile cli (prevents auto-start)

  # One-shot observer. Never started by `docker compose up`. Does not start or restart runners.
  trading-report:
    build:
      context: .
      dockerfile: Dockerfile.report
    container_name: trading-report
    restart: "no"
    profiles:
      - report
    networks:
      - trading-network
    environment:
      TRADING_REPORT_MONGO_URI_FILE: /run/secrets/trading_report_mongo_uri
      TRADING_REPORT_MONGO_DB: ${TRADING_REPORT_MONGO_DB:-trading_report}
      TRADING_REPORT_DEPLOYMENT_ID: ${TRADING_REPORT_DEPLOYMENT_ID:-paper-lab}
    secrets:
      - trading_report_mongo_uri
    volumes:
      - ${TRADING_REPORT_CONFIG:-./config/report.toml}:/app/report.toml:ro
      - ${TRADING_REPORT_LEVELS_JOURNAL:-./runtime-data/levels/submission-journal.jsonl}:/journals/levels/submission-journal.jsonl:ro
      - ${TRADING_REPORT_STRATEGIES_JOURNAL:-./runtime-data/strategies/submission-journal.jsonl}:/journals/strategies/submission-journal.jsonl:ro
      - ${TRADING_REPORTS_DIR:-./runtime-data/reports}:/reports
    command:
      [
        "scheduled",
        "--config",
        "/app/report.toml",
        "--reports-dir",
        "/reports",
        "--timeout-secs",
        "120",
      ]

volumes:
  mongodb_data:
    driver: local
  trading-logs:
    driver: local

secrets:
  trading_report_mongo_uri:
    file: ${TRADING_REPORT_MONGO_URI_FILE:-./secrets/trading_report_mongo_uri}

networks:
  trading-network:
    driver: bridge

