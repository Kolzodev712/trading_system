[package]
name = "trading_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async
tokio = { version = "1.32.0", features = ["full"] }
tokio-stream = "0.1.17"
async-trait = "0.1.73"
tokio-tungstenite = { version = "0.14", features = ["rustls-tls"] }

# HTTP
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.2"
urlencoding = "2.1.3"

# SerDe
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9.0"
serde_urlencoded = { version = "0.7.1" }
serde_qs = "0.12.0"

# Errors
anyhow = { version = "1.0", default-features = false }
thiserror = "1.0"

# Utils
chrono = { version = "0.4.31", features = ["serde"] }
smol_str = { version = "0.2", features = ["serde"] }
rust_decimal = { version = "1.35.0", features = ["serde"] }
base64 = "0.22.1"
uuid = { version = "1.10.0", features = ["v4", "fast-rng"] }

# gRPC utilities (NOT proto definitions)
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Logging (optional, for circuit breaker)
tracing = "0.1.40"

# Redis (for backward compatibility during migration)
redis = { version = "0.27.6", features = ["tokio-comp"] }

# MongoDB (for configuration persistence)
mongodb = { workspace = true }

