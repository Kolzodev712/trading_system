[package]
name = "trading_trace"
version = "0.1.0"
edition = "2021"

[dependencies]
# OpenTelemetry (for cold path)
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio", "trace", "metrics"] }

# OpenTelemetry exporters
opentelemetry-jaeger = { version = "0.20", features = ["rt-tokio"], optional = true }
prometheus = { version = "0.14", optional = true }

# Tracing integration
tracing = "0.1"
tracing-opentelemetry = { version = "0.22", optional = true }

# Random number generation for trace/span IDs and sampling
rand = "0.9"

# Thread-safe collections
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

# Async runtime (for exporters)
tokio = { version = "1.32", features = ["rt", "sync"], optional = true }

# Errors
thiserror = "1.0"
anyhow = { version = "1.0", default-features = false }

[features]
default = []
full = ["opentelemetry-jaeger", "prometheus", "tracing-opentelemetry", "tokio", "serde_json"]

[dev-dependencies]
serde_json = "1.0"
