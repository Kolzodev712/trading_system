# Prometheus config for the trading system.
# Scrapes /metrics from the app. When using with docker-compose, the app service name is trading-system.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Trading system metrics (use trading-system when run with main docker-compose)
  - job_name: trading-system
    static_configs:
      - targets: ["trading-system:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  # If the app runs on the host, add a config like this and set PROMETHEUS_EXTRA_ARGS or override the file:
  # - job_name: trading-system-host
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]
  #   metrics_path: /metrics
