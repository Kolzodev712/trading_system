[project]
name = "indicator-config-generator"
version = "0.1.0"
description = "Generate indicator configurations from Python DSL"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
indicator-generate = "indicator_config_generator.cli:generate"
indicator-validate = "indicator_config_generator.cli:validate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"

