[project]
name = "trading-system-python"
version = "0.1.0"
description = "Python tooling for trading system (indicator generation, strategy DSL)"
requires-python = ">=3.11"
dependencies = [
    "indicator-config-generator",
]

[project.scripts]
indicator-generate = "indicator_config_generator.cli:generate"
indicator-validate = "indicator_config_generator.cli:validate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading_system_python"]

[tool.uv.workspace]
members = [
    "indicator_config_generator",
    "strategy_dsl",
]

[tool.uv.sources]
indicator-config-generator = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
