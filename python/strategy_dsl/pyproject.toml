[project]
name = "strategy-dsl"
version = "0.1.0"
description = "Python DSL for defining trading strategies"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ast-decompiler>=0.7.0",  # For Python AST manipulation
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
strategy-compile = "strategy_dsl.cli:compile"
strategy-validate = "strategy_dsl.cli:validate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"

