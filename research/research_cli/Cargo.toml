[package]
name = "research_cli"
version = "0.1.0"
edition = "2021"
description = "Offline research commands over research_engine. Does not submit orders."
default-run = "research_cli"

[dependencies]
research_engine = { path = "../research_engine" }
strategy_core = { path = "../../libs/strategy_core" }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
research_engine = { path = "../research_engine" }
serde_json = { workspace = true }
