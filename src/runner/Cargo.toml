[package]
name = "runner"
version = "0.1.0"
edition = "2021"
default-run = "runner"

[dependencies]
trading_core = { path = "../../libs/trading_core" }
trading_trace = { path = "../../libs/trading_trace", features = ["full"] }
trading_networking = { path = "../../libs/trading_networking", features = ["zenoh"] }
trading_engine = { path = "../trading_engine" }
exchange_engine = { path = "../exchange_engine" }
dex_engine = { path = "../dex_engine" }
market_data_engine = { path = "../market_data_engine" }
indicator_engine = { path = "../indicator_engine" }
live_config = { path = "../live_config" }
asset_engine = { path = "../asset_engine" }
gateway = { path = "../gateway" }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# SerDe
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }

# Async 
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Authentication
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
pem = { workspace = true }
uuid = { workspace = true }

# Utils
parking_lot = { workspace = true }
smol_str = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
base64 = { workspace = true }

# Storage (optional, behind feature flag for future Web UI)
redis = { workspace = true, optional = true }

# HTTP Server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Testing
tokio-test = { workspace = true }

[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[[bin]]
name = "prop_replay"
path = "src/bin/prop_replay.rs"

[[bin]]
name = "donchian_daily_replay"
path = "src/bin/donchian_daily_replay.rs"

[[bin]]
name = "btc_price_ma_experiment"
path = "src/bin/btc_price_ma_experiment.rs"

[features]
default = []
redis = ["dep:redis"]
