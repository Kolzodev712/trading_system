[package]
name = "runner"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tonic-build = { version = "0.11", features = ["prost"] }

[dependencies]
trading_core = { path = "../../libs/trading_core" }
trading_engine = { path = "../trading_engine" }
exchange_engine = { path = "../exchange_engine" }
market_data_engine = { path = "../market_data_engine" }
indicator_engine = { path = "../indicator_engine" }
live_config = { path = "../live_config" }
asset_engine = { path = "../asset_engine" }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# SerDe
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }

# Async 
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Authentication
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
pem = { workspace = true }
uuid = { workspace = true }

# Utils
smol_str = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
base64 = { workspace = true }

# Storage (optional, behind feature flag for future Web UI)
redis = { workspace = true, optional = true }

# HTTP Server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Testing
tokio-test = { workspace = true }

[features]
default = []
redis = ["dep:redis"]
