[package]
name = "trading_engine"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
trading_core = { path = "../../libs/trading_core" }
indicator_engine = { path = "../indicator_engine" }
exchange_engine = { path = "../exchange_engine" }
# Note: Trading Engine communicates with Exchange Engine via channels,
# but needs exchange_engine dependency for type references (ExchangeStateManager)

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# SerDe
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }

# Async 
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Authentication
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
pem = { workspace = true }
uuid = { workspace = true }

# Storage (removed - channels are used for internal communication)
# Redis is no longer needed for Trading Engine

# Utils
smol_str = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
base64 = { workspace = true }

# MongoDB (for persistence)
mongodb = { workspace = true }

# Testing
tokio-test = { workspace = true }

