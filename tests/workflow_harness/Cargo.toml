[package]
name = "workflow_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test-only Paper/Demo workflow harness. Not a production crate."

[lib]
path = "src/lib.rs"

[[bin]]
name = "workflow_gate"
path = "src/bin/workflow_gate.rs"

[dependencies]
trading_proto = { path = "../../libs/trading_proto" }
anyhow = { workspace = true, default-features = false, features = ["std"] }
chrono = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
hex = { workspace = true }
hmac = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
